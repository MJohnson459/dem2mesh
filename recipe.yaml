context:
  version: "1.1.0"

package:
  name: dem2mesh
  version: ${{ version }}

source:
  path: .

build:
  number: 0
  script:
    - if: win
      then:
        - cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=%LIBRARY_PREFIX% -DCMAKE_PREFIX_PATH=%LIBRARY_PREFIX%
        - cmake --build build
        - cmake --install build
      else:
        - cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=$PREFIX ${CMAKE_ARGS}
        - cmake --build build
        - cmake --install build

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - cmake
    - ninja
  host:
    - libgdal-core
    - if: osx
      then: llvm-openmp
  run:
    # libgdal-core's run_exports set the lower bound to the exact version built
    # against. GDAL patch releases keep the ABI, so any patch of the minor works.
    - ${{ pin_compatible('libgdal-core', lower_bound='x.x', upper_bound='x.x') }}
  ignore_run_exports:
    by_name:
      - libgdal-core

tests:
  - files:
      source:
        - tests/make_dem.py
    requirements:
      run:
        - python
        - gdal
    script:
      - python tests/make_dem.py dem.tif
      - dem2mesh -inputFile dem.tif -outputFile mesh.ply -verbose
      - python -c "import os, sys; sys.exit(0 if os.path.getsize('mesh.ply') > 0 else 1)"

about:
  homepage: https://github.com/OpenDroneMap/dem2mesh
  repository: https://github.com/OpenDroneMap/dem2mesh
  license: GPL-3.0-or-later
  license_file:
    - LICENSE
    - vendor/jmeshlib/gpl.txt
  summary: Fast generation of 2.5D meshes from elevation models

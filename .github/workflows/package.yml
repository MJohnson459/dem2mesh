name: package

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-latest
          - windows-2022
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: prefix-dev/setup-pixi@v0.9.3
        with:
          pixi-version: latest
          run-install: false
      - name: Build package
        run: pixi build --output-dir dist
      - name: Test package
        shell: bash
        run: |
          for pkg in dist/*.conda; do
            pixi exec rattler-build test --channel conda-forge --package-file "$pkg"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: dem2mesh-${{ matrix.platform }}
          path: dist/*.conda
          retention-days: 7
      - name: Publish to prefix.dev
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: pixi exec rattler-build upload prefix --channel mjohnson459/opendronemap dist/*.conda
